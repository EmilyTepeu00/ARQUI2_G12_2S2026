# =============================================================================
#  SmartEgg - Plataforma IoT distribuida
#  Levanta broker MQTT, base de datos, backend, frontend y Grafana en una red
#  propia, todo detras de un unico proxy.
#
#      cp .env.example .env
#      docker compose up -d
#      docker compose ps
#
#  Todo se consume por el puerto 8080: la SPA en /, la API en /api, el broker
#  por WebSocket en /mqtt y Grafana en /grafana/.
# =============================================================================

name: smartegg

services:

  # --------------------------------------------------------------- Broker ---
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smartegg-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT_HOST:-1883}:1883"     # MQTT nativo (backend, Grafana)
      - "${MQTT_WS_PORT_HOST:-9001}:9001"  # WebSocket (alarmas en el navegador)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks: [smartegg_net]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------- Base de datos ---
  mongo:
    image: mongo:7
    container_name: smartegg-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT_HOST:-27017}:27017"
    volumes:
      # El historial NO se sobrescribe ni se pierde al recrear el contenedor.
      - mongo_data:/data/db
    networks: [smartegg_net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------- Backend ---
  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    image: smartegg-backend:latest
    container_name: smartegg-backend
    restart: unless-stopped
    # Docker aporta tini como PID 1: al parar el contenedor los hilos de fondo
    # (serial y MQTT) se apagan limpio y se publica el "offline" del status.
    init: true
    env_file: [.env]
    environment:
      # Ganan sobre .env: dentro de la red los host son los nombres de servicio.
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
    ports:
      - "${BACKEND_PORT_HOST:-5000}:5000"
    volumes:
      # Las herramientas de prueba (simulador del nodo y suites) NO van dentro
      # de la imagen: se montan de solo lectura. Asi la imagen queda liviana y
      # el simulador puede correr DENTRO del contenedor, que es la unica forma
      # de que el backend containerizado vea su puerto serial virtual: un pty
      # no se puede compartir entre contenedores ni con el anfitrion.
      #
      #     docker compose exec -d backend python tools/fake_serial.py
      - ../Backend/tools:/app/tools:ro
    depends_on:
      mosquitto:
        condition: service_started
      mongo:
        condition: service_healthy
    networks: [smartegg_net]

    # --- Nodo fisico -------------------------------------------------------
    # Para que el contenedor lea el Arduino, descomenta el bloque de abajo y
    # ajusta el dispositivo (/dev/ttyUSB0 o /dev/ttyACM0). Comprobalo antes con:
    #     ls -l /dev/ttyUSB* /dev/ttyACM*
    #
    # Solo funciona en Linux. En Windows/macOS no se puede pasar un COM a un
    # contenedor Linux: ahi pone SERIAL_ENABLED=false en .env y corre el backend
    # en el anfitrion con `python run.py` apuntando a localhost.
    #
    # ponytail: si SERIAL_ENABLED=false o el dispositivo no existe (Windows,
    # otra maquina), comenta estas dos lineas o el contenedor no arranca.
    #devices:
    #  - "${SERIAL_PORT}:${SERIAL_PORT}"

  # -------------------------------------------------------------- Grafana ---
  grafana:
    # 11.6.11 es el minimo que pide el datasource Infinity 4.x: en 11.3 el
    # plugin se registra en el backend pero NO carga en el navegador (falla al
    # resolver react/jsx-runtime, error SystemJS #7). Mismo major, asi que la
    # base interna de Grafana migra sola.
    image: grafana/grafana:11.6.11
    container_name: smartegg-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT_HOST:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Ninguno de los dos datasources viene con Grafana; se instalan al
      # arrancar. mqtt-datasource sirve el tiempo real; infinity consulta el
      # historico por la API REST (Mongo no tiene datasource gratuito).
      #
      # Las versiones van FIJAS a proposito. Sin fijarlas se instala la ultima,
      # y ahi fallan dos cosas distintas: una infinity mas nueva que la Grafana
      # de arriba se registra pero no carga en el navegador, y el mqtt-datasource
      # 1.3.x rompe la suscripcion con 'invalid orgId supplied in request'
      # (bug grafana/mqtt-datasource#361). La 1.2.1 hace streaming bien.
      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-grafana-mqtt-datasource 1.2.1,yesoreyeram-infinity-datasource 4.0.0}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-mqtt-datasource
      GF_USERS_DEFAULT_THEME: light
      # Grafana queda servida bajo /grafana/ detras del proxy. Sin estas dos
      # variables sus enlaces internos apuntan a la raiz y se rompen.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8080/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Para que el dashboard se vea SIN iniciar sesion.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANON_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_ANON_ROLE:-Viewer}
      GF_SECURITY_ALLOW_EMBEDDING: ${GRAFANA_ALLOW_EMBEDDING:-false}
    volumes:
      - grafana_data:/var/lib/grafana
      # Dashboards y datasources: se cargan solos al levantar.
      - ../Grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      mosquitto:
        condition: service_started
      mongo:
        condition: service_healthy
    networks: [smartegg_net]

  # ---------------------------------------------------------------- Proxy ---
  # Un solo puerto para todo. Es el unico que hay que exponer al exterior.
  caddy:
    image: caddy:2-alpine
    container_name: smartegg-caddy
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT_HOST:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      grafana:
        condition: service_started
      mosquitto:
        condition: service_started
    networks: [smartegg_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------- Tunel publico ---
  # No arranca con `docker compose up -d`. Se levanta aparte:
  #     docker compose --profile publico up -d cloudflared
  #     docker compose logs cloudflared | grep trycloudflare
  # La URL sale en el log. No hace falta cuenta ni tarjeta.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smartegg-tunel
    restart: unless-stopped
    profiles: [publico]
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      caddy:
        condition: service_started
    networks: [smartegg_net]

  # ------------------------------------------------------------- Frontend ---
  # SPA de React compilada y servida por Nginx. No necesita variables con URLs:
  # el codigo usa rutas relativas (/api, /mqtt) y las resuelve Caddy, asi que la
  # misma imagen sirve en local y detras del tunel publico.
  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        VITE_MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-smartegg}
        VITE_MQTT_NODE_ID: ${NODE_ID:-incubadora-01}
    image: smartegg-frontend:latest
    container_name: smartegg-frontend
    restart: unless-stopped
    # Se publica solo para depurar. El acceso normal es por Caddy (puerto 8080).
    ports:
      - "${FRONTEND_PORT_HOST:-5173}:80"
    depends_on: [backend]
    networks: [smartegg_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
  mosquitto_data:
  mosquitto_log:
  mongo_data:
  grafana_data:

networks:
  smartegg_net:
    driver: bridge
